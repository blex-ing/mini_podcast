name: CI Python and Web

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, "feature/**", "release/**"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.9.10
      - run: python -m compileall -q 2_recopilacion_info
      - run: ruff check 2_recopilacion_info
      - run: |
          test -f documentacion/FLUJO_GIT_Y_RELEASES.md
          test -f documentacion/ARQUITECTURA_DESARROLLO.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run validate:roadmap
      - run: npm run check:design
      - run: npm run build
      - run: npm run lint
      - name: Save dependency lockfile for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-lock-${{ github.run_id }}
          path: web/package-lock.json
          if-no-files-found: warn
          retention-days: 3

  visual:
    name: Visual QA (Chromium screenshots)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Upload screenshots and HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-qa-${{ github.run_id }}
          path: |
            web/test-results/visual
            web/visual-report
          if-no-files-found: warn
          retention-days: 14
