name: CI Python

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, "feature/**", "release/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tool
        run: python -m pip install ruff==0.9.10
      - name: Validate Python syntax
        run: python -m compileall -q 2_recopilacion_info
      - name: Ruff lint
        run: ruff check 2_recopilacion_info
      - name: Basic repository checks
        run: |
          test -f README.md
          test -f documentacion/FLUJO_GIT_Y_RELEASES.md
          test -f documentacion/ARQUITECTURA_DESARROLLO.md
