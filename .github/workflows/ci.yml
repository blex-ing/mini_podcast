name: CI Python and Web

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, "feature/**", "release/**"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.9.10
      - run: python -m compileall -q 2_recopilacion_info
      - run: ruff check 2_recopilacion_info
      - run: |
          test -f documentacion/FLUJO_GIT_Y_RELEASES.md
          test -f documentacion/ARQUITECTURA_DESARROLLO.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run validate:roadmap
      - run: npm run check:design
      - run: npm run build
      - run: npm run lint
